services:
  postgres:
    image: postgres:16
    container_name: streamgo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamgo
      POSTGRES_USER: streamgo
      POSTGRES_PASSWORD: streamgo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: